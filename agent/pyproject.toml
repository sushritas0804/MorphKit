[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphkit-agent"
version = "0.1.0"
description = "Local agent for Morphkit segments that adapt to a Python/FastAPI project."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "libcst>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
morphkit = "morphkit_agent.cli:main"

[tool.setuptools.packages.find]
include = ["morphkit_agent*"]

[tool.setuptools.package-data]
morphkit_agent = ["segments/*/manifest.yaml"]
